name = "zaremperfumery"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "zarem-db"
database_id = "ded1b48c-ce1d-40ee-93c2-9f269f503818"

# Image uploads: create an R2 bucket named zarem-images first (Storage & Databases > R2)
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "zarem-images"

[vars]
# Optional: SITE_URL = "https://yourdomain.com"  (used for the Paystack return link)
